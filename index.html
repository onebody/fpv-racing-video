        /* ===== Reset & Base ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0a0a0f; color: #eee; line-height: 1.6;
            min-height: 100vh; min-height: -webkit-fill-available;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }
        img, iframe { max-width: 100%; }
        button { font-family: inherit; }

        /* ===== CSS Variables ===== */
        :root {
            --red: #0ea5e9; --red-dark: #0284c7; --orange: #38bdf8; --amber: #7dd3fc;
            --bg: #0a0a0f; --bg2: #12121c; --bg3: #1a1a28; --bg4: #24243a;
            --text: #eee; --text2: #999; --text3: #666;
            --border: #2a2a3a;
            --r: 12px; --r-sm: 8px; --r-xs: 6px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #0284c7, #0ea5e9, #38bdf8);
            padding: 2rem 1.25rem 1.5rem;
            text-align: center;
            padding-top: calc(2rem + var(--safe-top));
        }
        .header h1 { font-size: clamp(1.5rem, 6vw, 2.8rem); font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
        .header p { font-size: clamp(0.82rem, 2.5vw, 1.05rem); opacity: .92; margin-top: .3rem; }

        /* ===== Stats ===== */
        .stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            background: var(--bg2); border-bottom: 1px solid var(--border);
        }
        .stats > div { text-align: center; padding: 1.2rem .5rem; }
        .stats > div + div { border-left: 1px solid var(--border); }
        .stats .val { font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 800; color: var(--red); }
        .stats .lbl { font-size: .75rem; color: var(--text3); letter-spacing: 1px; margin-top: .15rem; }

        /* ===== Filters (horizontal scroll on mobile) ===== */
        .filters {
            position: sticky; top: 0; z-index: 200;
            background: var(--bg); border-bottom: 1px solid var(--border);
            padding: .75rem; padding-top: calc(.75rem + var(--safe-top));
            display: flex; gap: .5rem; overflow-x: auto;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }
        .fbtn {
            flex-shrink: 0; padding: .5rem 1rem; border: 1px solid var(--border);
            background: var(--bg2); color: var(--text); border-radius: 2rem;
            font-size: .85rem; cursor: pointer; transition: .2s;
            -webkit-tap-highlight-color: transparent; white-space: nowrap;
        }
        .fbtn:active, .fbtn.on { background: var(--red); border-color: var(--red); color: #fff; }

        /* ===== Content ===== */
        .wrap {
            max-width: 1400px; margin: 0 auto;
            padding: 1rem; padding-bottom: calc(1rem + var(--safe-bottom));
        }

        /* ===== Update Report ===== */
        .update-report {
            background: linear-gradient(135deg, #0c4a6e, #0369a1, #0284c7);
            border: 2px solid var(--amber);
            border-radius: var(--r);
            margin-bottom: 1.5rem;
            overflow: hidden;
            animation: reportGlow 2s ease-in-out infinite alternate;
        }
        @keyframes reportGlow {
            from { box-shadow: 0 0 8px rgba(14,165,233,0.3); }
            to { box-shadow: 0 0 20px rgba(14,165,233,0.6); }
        }
        .update-report-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: .85rem 1.15rem; background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(125,211,252,0.25);
        }
        .update-report-header h3 {
            font-size: .95rem; font-weight: 700; color: var(--amber);
            display: flex; align-items: center; gap: .4rem;
        }
        .update-report-header .update-date {
            font-size: .78rem; color: rgba(255,255,255,0.65);
        }
        .update-report-body {
            padding: .85rem 1.15rem;
        }
        .update-report-body .update-summary {
            font-size: .88rem; color: #e0f2fe; margin-bottom: .6rem; font-weight: 500;
        }
        .update-report-body .update-list {
            list-style: none; padding: 0; margin: 0;
        }
        .update-report-body .update-list li {
            padding: .4rem 0; font-size: .82rem; color: rgba(255,255,255,0.85);
            border-bottom: 1px solid rgba(125,211,252,0.1);
            display: flex; align-items: flex-start; gap: .5rem;
        }
        .update-report-body .update-list li:last-child { border-bottom: none; }
        .update-report-body .update-list li::before {
            content: '🆕'; flex-shrink: 0; font-size: .75rem; margin-top: .1rem;
        }
        .update-report-body .update-list .ul-who {
            color: var(--amber); font-weight: 600; margin-right: .3rem;
        }
        .update-report-body .update-empty {
            font-size: .85rem; color: rgba(255,255,255,0.5); font-style: italic;
        }
        .update-report-body .update-detail {
            font-size: .75rem; color: rgba(255,255,255,0.55); margin-top: .6rem;
            padding-top: .5rem; border-top: 1px solid rgba(125,211,252,0.15);
        }

        /* ===== Note ===== */
        .note {
            background: var(--bg3); border-left: 4px solid var(--red);
            padding: .875rem 1rem; border-radius: 0 var(--r-sm) var(--r-sm) 0;
            margin-bottom: 1.5rem; font-size: .85rem; color: var(--text2);
        }
        .note b { color: var(--red); display: block; margin-bottom: .2rem; }

        /* ===== Section ===== */
        .sec { margin-bottom: 2rem; }
        .sec-head {
            display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
            padding: 1rem 1.25rem; background: var(--bg2);
            border-radius: var(--r); border-left: 4px solid var(--red);
            margin-bottom: 1rem;
        }
        .sec-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 700; flex-shrink: 0;
        }
        .sec-meta { flex: 1; min-width: 0; }
        .sec-meta h2 { font-size: clamp(1rem, 3vw, 1.35rem); }
        .sec-meta p { font-size: .8rem; color: var(--text3); }
        .sec-link {
            flex-shrink: 0; padding: .45rem .9rem; background: var(--red);
            color: #fff; border-radius: var(--r-xs); font-size: .8rem;
            transition: .2s; white-space: nowrap;
        }
        .sec-link:active { background: var(--red-dark); }

        /* ===== Grid ===== */
        .grid {
            display: grid; gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
        }

        /* ===== Card ===== */
        .card {
            background: var(--bg2); border-radius: var(--r);
            border: 1px solid var(--border); overflow: hidden;
            transition: border-color .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .card-top { padding: 1rem 1.15rem .75rem; border-bottom: 1px solid var(--border); }
        .card-who {
            display: inline-flex; align-items: center; gap: .35rem;
            background: var(--red); padding: .2rem .65rem; border-radius: 2rem;
            font-size: .78rem; font-weight: 600; margin-bottom: .45rem;
        }
        .plat { font-size: .6rem; padding: .1rem .35rem; border-radius: 3px; margin-left: .3rem; vertical-align: middle; }
        .plat-b { background: #00a1d6; }
        .plat-d { background: #222; border: 1px solid #555; }
        .plat-y { background: #f00; }
        .card-title { font-size: clamp(.92rem, 2.5vw, 1.05rem); font-weight: 600; line-height: 1.5; }

        .card-body { padding: .875rem 1.15rem; }
        .card-desc { font-size: .82rem; color: var(--text2); line-height: 1.55; margin-bottom: .65rem; }
        .card-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .65rem; }
        .t { background: var(--bg4); padding: .15rem .5rem; border-radius: 1rem; font-size: .72rem; color: var(--amber); }

        .card-btns { display: flex; gap: .5rem; }
        .cb {
            flex: 1; padding: .6rem .4rem; border: none; border-radius: var(--r-xs);
            font-size: .82rem; font-weight: 500; text-align: center; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: .25rem;
            transition: .15s; -webkit-tap-highlight-color: transparent;
        }
        .cb-p { background: var(--red); color: #fff; }
        .cb-p:active { background: var(--red-dark); }
        .cb-s { background: var(--bg4); color: #fff; }
        .cb-s:active { background: #333350; }

        /* ===== Player ===== */
        .pwrap { display: none; margin-top: .65rem; background: #000; border-radius: var(--r-xs); overflow: hidden; }
        .pwrap.on { display: block; }
        .pwrap iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
        .pclose {
            width: 100%; padding: .4rem; background: #1a1a1a; color: #888;
            border: none; font-size: .78rem; cursor: pointer; text-align: center;
        }

        /* ===== More ===== */
        .more {
            text-align: center; padding: 1.25rem; background: var(--bg2);
            border-radius: var(--r); margin-top: 1rem; border: 2px dashed var(--border);

        .more h3 { color: var(--red); font-size: .95rem; margin-bottom: .4rem; }
        .more p { color: var(--text3); font-size: .82rem; margin-bottom: .65rem; }

        /* ===== Footer ===== */
        .ft { text-align: center; padding: 1.5rem 1rem; color: var(--text3); font-size: .75rem; border-top: 1px solid var(--border); }

        /* ===== Desktop hover effects ===== */
        @media (hover: hover) {
            .card:hover { border-color: var(--red); }
            .cb-p:hover { background: var(--red-dark); }
            .cb-s:hover { background: #333350; }
            .sec-link:hover { background: var(--red-dark); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .header { padding: 1.5rem 1rem 1.25rem; }
            .wrap { padding: .75rem; }
            .grid { gap: .75rem; }
            .sec-head { padding: .75rem 1rem; gap: .6rem; }
            .sec-avatar { width: 40px; height: 40px; font-size: 1rem; }
        }
        @media (min-width: 769px) {
            .wrap { padding: 2rem; }
        }
        @media (min-width: 1024px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>

const pn={bilibili:'B站',douyin:'抖音',youtube:'YouTube'};
const pc={bilibili:'plat-b',douyin:'plat-d',youtube:'plat-y'};

function card(v){
    const hasBv=v.bv;
    return`<div class="card" data-k="${v.k}" data-p="${v.p}">
<div class="card-top"><div class="card-who">${v.who}<span class="plat ${pc[v.p]}">${pn[v.p]}</span></div><div class="card-title">${v.t}</div></div>
<div class="card-body">
<div class="card-desc">${v.d}</div>
<div class="card-tags">${v.tg.map(t=>`<span class="t">#${t}</span>`).join('')}</div>
<div class="card-btns">
${hasBv?`<button class="cb cb-p" onclick="_play('${v.id}',this)">▶ 播放</button>`:''}
<a class="cb cb-s" href="${v.u}" target="_blank" rel="noopener">🔗 跳转</a>
</div>
${hasBv?`<div class="pwrap" id="pw-${v.id}"></div>`:''}
</div></div>`;
}

function _play(id,btn){
    const v=V.find(x=>x.id===id); if(!v||!v.bv)return;
    const pw=document.getElementById('pw-'+id);
    if(pw.classList.contains('on')){
        pw.classList.remove('on');pw.innerHTML='';btn.textContent='▶ 播放';
    }else{
        pw.innerHTML=`<iframe src="https://player.bilibili.com/player.html?bvid=${v.bv}&autoplay=0&high_quality=1" allowfullscreen scrolling="no"></iframe><button class="pclose" onclick="_close('${id}',this)">收起 ▲</button>`;
        pw.classList.add('on');btn.textContent='⏹ 关闭';
        setTimeout(()=>pw.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
    }
}
function _close(id,btn){
    const pw=document.getElementById('pw-'+id);
    pw.classList.remove('on');pw.innerHTML='';
    const cbtn=pw.closest('.card').querySelector('.cb-p');
    if(cbtn)cbtn.textContent='▶ 播放';
}

function render(){
    document.getElementById('cnt').textContent=V.length;
    const app=document.getElementById('app');
    app.innerHTML=G.map(g=>{
        const vs=V.filter(v=>v.k===g.k);
        return`<div class="sec" data-k="${g.k}">
<div class="sec-head">
<div class="sec-avatar">${g.av}</div>
<div class="sec-meta"><h2>${g.n}</h2><p>${g.d}</p></div>
${g.lk?`<a class="sec-link" href="${g.lk}" target="_blank" rel="noopener">${g.lt}</a>`:''}
</div>
<div class="grid">${vs.map(card).join('')}</div>
${g.mt?`<div class="more"><h3>+ 更多${g.av}的视频</h3><p>${g.mt}</p><a class="cb cb-p" href="${g.ml}" target="_blank" rel="noopener" style="display:inline-flex;width:auto;padding:.55rem 1.5rem">查看全部</a></div>`:''}
</div>`;
    }).join('');
}

// Filters
document.getElementById('filters').addEventListener('click',function(e){
    const b=e.target.closest('.fbtn');if(!b)return;
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const f=b.dataset.f;
    document.querySelectorAll('.sec').forEach(s=>{
        const sk=s.dataset.k;
        if(f==='all'||f===sk){s.style.display='';s.querySelectorAll('.card').forEach(c=>c.style.display='');return;}
        if(f==='bilibili'||f==='douyin'){s.style.display='';s.querySelectorAll('.card').forEach(c=>{c.style.display=c.dataset.p===f?'':'none';});return;}
        s.style.display='none';
    });
});

function renderUpdateReport() {
    const area = document.getElementById('update-report-area');
    if (!UPDATE_REPORT || UPDATE_REPORT.count === 0) {
        area.innerHTML = '';
        return;
    }
    const r = UPDATE_REPORT;
    let itemsHtml = '';
    if (r.items && r.items.length > 0) {
        itemsHtml = '<ul class="update-list">' +
            r.items.map(it =>
                `<li><span class="ul-who">${it.who}</span>${it.title} <span class="plat ${pc[it.platform]||''}" style="font-size:.6rem;padding:.1rem .3rem;border-radius:3px;vertical-align:middle;margin-left:.3rem">${pn[it.platform]||it.platform}</span></li>`
            ).join('') +
            '</ul>';
    }
    area.innerHTML = `
    <div class="update-report">
        <div class="update-report-header">
            <h3>🔔 最新更新</h3>
            <span class="update-date">${r.date}</span>
        </div>
        <div class="update-report-body">
            <div class="update-summary">本次更新新增 <b style="color:#fff;font-size:1.1em">${r.count}</b> 个竞速视频</div>
            ${itemsHtml}
            ${r.note ? `<div class="update-detail">${r.note}</div>` : ''}
        </div>
    </div>`;
}
